name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the newest run on a PR ref is interesting; an older one still queued is
# reporting on a diff nobody will merge. Pushes to main are NOT cancelled: two
# merges in quick succession would leave the first commit with a cancelled
# check, which is neither pass nor fail, and main's history would have gaps
# where nothing ever verified the merged tree.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # mise refuses to read a config file it has not been trusted with: every
  # command exits with "Config files in ... are not trusted", and a runner has
  # no interactive prompt to grant it. jdx/mise-action does not run `mise
  # trust`, so without this the whole job fails before any task runs. Granted
  # to the one config file rather than the workspace root, so a config added
  # elsewhere in a PR is not trusted along with it.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config.toml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here needs git auth (the lint tasks use `git ls-files`,
          # which is local), and the next step runs shell scripts from the PR
          # branch. Don't leave the token in .git/config for them to read.
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # biome (JS), rumdl (Markdown) and yamlfmt (YAML + skill frontmatter).
      # .config/mise/config.toml tracks "latest" for all three, so a lint
      # failure here can come from an upstream release rather than this diff.
      - run: mise run lint

  test:
    # The mywiki checker is a zero-dependency script that claims to run on any
    # Node 20+, so CI exercises the floor of that claim, the current LTS line,
    # and 26 (what the repo is actually developed on) rather than whatever Node
    # the runner image happens to ship.
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # No Node is pinned in .config/mise/config.toml, so mise leaves the
      # version selected above alone. If anyone ever pins one, every leg would
      # silently test that single version while still reporting four. Ask mise
      # which node it resolves, not the ambient shell: `mise run test` runs in
      # mise's context, so that is the only answer that proves anything.
      - name: Verify the tests will run on the matrix Node
        run: |
          actual=$(mise exec -- node --version)
          case "$actual" in
            v${{ matrix.node }}.*) echo "Node $actual OK" ;;
            *) echo "::error::expected Node ${{ matrix.node }}.x, got $actual"; exit 1 ;;
          esac
      - run: mise run test
