# The mywiki skill's checker is deliberately zero-dependency and runs on any
# Node 20+, so Node is intentionally NOT pinned here: `mise run test` should
# exercise whatever Node the developer (and the installed skill) actually uses.
# The linters below are pinned to exact versions, so `mise run lint` gives the
# same answer locally and in CI; bump them in their own PR. All three are
# standalone binaries from aqua, so the repo still needs no package.json, no
# node_modules, and no Python.
[tools]
biome = "2.6.2"    # JavaScript and JSON (Markdown is rumdl's; see biome.jsonc)
rumdl = "0.3.0"    # Markdown
yamlfmt = "0.21.0" # YAML

[env]
# Load variables from the .env and .env.local files
_.file = [".env"]
